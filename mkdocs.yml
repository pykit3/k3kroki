site_name: k3kroki
site_description: Convert diagrams to images via the kroki.io API
site_url: https://k3kroki.readthedocs.io
repo_url: https://github.com/pykit3/k3kroki
repo_name: pykit3/k3kroki

theme:
  name: material
  palette:
    primary: blue
    accent: blue

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
